# Render Blueprint Specification for Smart Livestock Health
# Documentation: https://render.com/docs/blueprint-spec
version: "1"

services:
  - type: web
    name: smart-livestock-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: smart-livestock-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: smart-livestock-api
      - key: JWT_AUDIENCE
        value: smart-livestock-mobile
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:8081,https://smart-livestock-backend.onrender.com

databases:
  - name: smart-livestock-db
    plan: free
    region: oregon
    databaseName: smart_livestock_db
    user: smart_user
