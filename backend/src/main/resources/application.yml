spring:
  application:
    name: smart-livestock-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_livestock_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:smart_livestock_health_dev_jwt_secret_key_32bytes_min!}
  issuer: ${JWT_ISSUER:smart-livestock-api}
  audience: ${JWT_AUDIENCE:smart-livestock-mobile}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000} # 15 minutes
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:2592000000} # 30 days

server:
  port: ${PORT:${SERVER_PORT:8085}}
  address: ${SERVER_ADDRESS:0.0.0.0}
  error:
    include-stacktrace: never
    include-message: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:8085,http://127.0.0.1:8081}

logging:
  level:
    root: INFO
    com.smartlivestock.backend: INFO

scheduling:
  device-monitoring:
    enabled: true
    fixed-delay-ms: ${DEVICE_MONITORING_FIXED_DELAY_MS:5000}
  offline-threshold-seconds: ${DEVICE_OFFLINE_THRESHOLD_SECONDS:30}
  grace-period-hours: 2

