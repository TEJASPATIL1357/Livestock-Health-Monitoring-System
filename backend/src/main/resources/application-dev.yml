spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartlivestock}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Tejas@123}
    driver-class-name: org.postgresql.Driver

  jpa:
