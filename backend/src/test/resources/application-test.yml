spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

jwt:
  secret: smart_livestock_health_test_jwt_secret_key_32bytes_min!
  issuer: smart-livestock-api
  audience: smart-livestock-mobile
  access-token-expiration-ms: 900000 # 15 minutes
  refresh-token-expiration-ms: 2592000000 # 30 days

server:
  port: 0

logging:
  level:
    com.smartlivestock.backend: DEBUG
